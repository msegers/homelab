---
# Non-secret host settings are committed normally. Keep the actual password in
# vault.yml, created with ansible-vault (see ansible/README.md).
compose_bind_ip: 192.168.68.111
compose_pihole_password: "{{ vault_compose_pihole_password }}"
compose_pihole_domain: pihole.mathijs.se
compose_pihole_allowed_networks: [192.168.68.0/24]
compose_private_tls_enabled: true
compose_cloudflare_api_token: "{{ vault_cloudflare_api_token }}"
compose_home_tools_enabled: true
compose_home_tools_domain: lab.mathijs.se
compose_home_tools_allowed_networks: [192.168.68.0/24]
# Inventory owns the full local-hosts list. Import any manual Pi-hole records
# before deploying; LAN clients must use Pi-hole to resolve these names.
compose_pihole_local_hosts:
  - "{{ compose_bind_ip }} lab.mathijs.se"
  - "{{ compose_bind_ip }} pihole.mathijs.se"

valheim_enabled: true
# Docker image's scheduled backups remain off until NAS storage is ready.
valheim_backups_enabled: false
# Independent safety archives before world changes; deletion always requires one.
valheim_pre_change_backups: true
valheim_idle_shutdown_enabled: true
valheim_idle_timeout_seconds: 3600
valheim_dashboard_enabled: true
valheim_dashboard_bind_ip: "{{ compose_bind_ip }}"
valheim_dashboard_allowed_networks: [192.168.68.0/24]
valheim_dashboard_allowed_hosts: [lab.mathijs.se]
# Ansible discovers and trusts only this Caddy container's private IPv4 peers.
valheim_dashboard_proxy_container: homelab-proxy-1
