# Copy this file to inventory.ini and edit it for your host.
# inventory.ini is gitignored.
#
# Replace YOUR_SSH_USER with your Debian user's name. If your host allows
# direct root SSH, set ansible_user=root and ansible_become=false instead.
[homelab]
elitedesk ansible_host=192.168.68.111 ansible_user=YOUR_SSH_USER ansible_become=true

# Optional: use a specific key rather than your SSH agent/default key.
# [homelab:vars]
# ansible_ssh_private_key_file=~/.ssh/id_ed25519
