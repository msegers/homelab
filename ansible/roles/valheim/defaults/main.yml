---
valheim_enabled: false
valheim_home: /var/lib/homelab-valheim
valheim_project_dir: "{{ valheim_home }}/stack"
valheim_project_name: homelab-valheim
# Maintained upstream image, pinned to the verified amd64 release manifest.
valheim_server_image: ghcr.io/community-valheim-tools/valheim-server@sha256:f34d67ba8023e343b10ffda0144759a8c8d986f276510460315a01051bed8a6d
valheim_user: valheim-game
valheim_group: valheim-game
# Optional valheim_uid / valheim_gid pin unused numeric IDs before creation.
# Otherwise the OS allocates stable system IDs; existing IDs are never changed.

valheim_config_dir: "{{ valheim_home }}/config"
valheim_worlds_dir: "{{ valheim_home }}/saves"
valheim_backups_dir: "{{ valheim_home }}/backups"
# Docker image's scheduled backups only; native game backups stay enabled.
valheim_backups_enabled: true
# Independent policy for world switches. Deletion always archives first.
valheim_pre_change_backups: true
valheim_data_dir: "{{ valheim_home }}/server"
valheim_state_dir: "{{ valheim_home }}/control"
valheim_required_mounts: []
valheim_required_mount_uuids: {}

valheim_game_bind_ip: "{{ compose_bind_ip }}"
valheim_server_port: 2456
valheim_server_name: Homelab Valheim
valheim_world_name: Homelab
valheim_server_password: "{{ vault_valheim_server_password }}"
# Steam A2S player counts require public listing and no crossplay. This does
# not configure router port forwarding. Unknown counts never trigger shutdown.
valheim_server_public: true
valheim_crossplay: false
valheim_timezone: Europe/Stockholm
valheim_stop_timeout: 120
# Opt in only after the live A2S acceptance test (see docs/valheim-acceptance.md).
valheim_idle_shutdown_enabled: false
valheim_idle_timeout_seconds: 3600
valheim_idle_poll_seconds: 60

# Built on the Ansible controller, not on the game host. Static musl binaries
# avoid depending on the controller machine's glibc version.
valheim_rust_target: x86_64-unknown-linux-musl
valheim_cargo_command: cargo
valheim_dashboard_enabled: false
valheim_dashboard_port: 8787
valheim_dashboard_bind_ip: 127.0.0.1
valheim_dashboard_allowed_networks: [127.0.0.0/8]
valheim_dashboard_allowed_hosts: []
# Empty disables proxy discovery; reusable defaults remain loopback-only.
valheim_dashboard_proxy_container: ""
