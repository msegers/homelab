---
- name: Validate Valheim settings
  ansible.builtin.assert:
    that:
      - ansible_architecture == 'x86_64'
      - valheim_project_dir is match('^/[A-Za-z0-9_/-]+$')
      - valheim_project_dir not in ['/', '/opt', '/opt/homelab']
      - valheim_game_bind_ip in ansible_all_ipv4_addresses
      - 1024 <= valheim_server_port | int <= 65533
      - valheim_account.uid | int > 0
      - valheim_account.group | int > 0
      - valheim_world_name is match('^[A-Za-z0-9_][A-Za-z0-9_-]*$')
      - valheim_server_name is string
      - valheim_server_name | length > 0
      - valheim_idle_timeout_seconds | int >= 60
      - 15 <= valheim_idle_poll_seconds | int <= 600
    fail_msg: Use an amd64 host, assigned bind address, a valid world name/UDP port, and a 60+ second idle timeout.

- name: Validate storage directories
  ansible.builtin.assert:
    that:
      - item is match('^/[A-Za-z0-9_/-]+$')
      - item not in ['/', '/opt', '/mnt', '/home', '/var', '/var/lib']
    fail_msg: Choose dedicated absolute Valheim subdirectories, not storage roots.
  loop:
    - "{{ valheim_project_dir }}"
    - "{{ valheim_config_dir }}"
    - "{{ valheim_worlds_dir }}"
    - "{{ valheim_backups_dir }}"
    - "{{ valheim_data_dir }}"
    - "{{ valheim_state_dir }}"

- name: Keep saves and backups in separate directories
  ansible.builtin.assert:
    that:
      - valheim_backups_dir != valheim_worlds_dir
      - not valheim_backups_dir.startswith(valheim_worlds_dir.rstrip('/') ~ '/')
      - not valheim_worlds_dir.startswith(valheim_backups_dir.rstrip('/') ~ '/')
    fail_msg: Saves and backups must be separate, non-nested directories.

- name: Keep controller state and Docker runtime out of game mounts
  ansible.builtin.assert:
    that:
      - valheim_state_dir != item
      - not valheim_state_dir.startswith(item.rstrip('/') ~ '/')
      - valheim_runtime_dir != item
      - not valheim_runtime_dir.startswith(item.rstrip('/') ~ '/')
    fail_msg: Game storage must not expose the controller directory or private Docker socket.
  loop:
    - "{{ valheim_config_dir }}"
    - "{{ valheim_worlds_dir }}"
    - "{{ valheim_backups_dir }}"
    - "{{ valheim_data_dir }}"

- name: Require configured storage mounts before creating directories
  ansible.builtin.command:
    argv: [mountpoint, -q, "{{ item }}"]
  loop: "{{ valheim_required_mounts }}"
  changed_when: false
  check_mode: false

- name: Check the private Docker socket
  ansible.builtin.stat:
    path: "{{ valheim_docker_socket }}"
  register: valheim_socket

- name: Require the dedicated user's Docker socket
  ansible.builtin.assert:
    that:
      - valheim_socket.stat.exists
      - valheim_socket.stat.issock
      - valheim_socket.stat.uid == valheim_account.uid
    fail_msg: Valheim requires its dedicated user's rootless Docker socket.

- name: Validate game password
  ansible.builtin.assert:
    that:
      - valheim_server_password is string
      - valheim_server_password | length >= 5
      - "'\n' not in valheim_server_password and '\r' not in valheim_server_password"
    fail_msg: Set vault_valheim_server_password to a password of 5+ characters without newlines.
  no_log: true

- name: Create private runtime and storage directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ valheim_account.uid }}"
    group: "{{ valheim_account.group }}"
    mode: "0700"
  loop:
    - "{{ valheim_project_dir }}"
    - "{{ valheim_config_dir }}"
    - "{{ valheim_worlds_dir }}"
    - "{{ valheim_backups_dir }}"
    - "{{ valheim_data_dir }}"
    - "{{ valheim_state_dir }}"

# Rendering configuration deliberately does not run Compose. A stopped game
# stays stopped, and running games change only on an explicit user command.
- name: Render Valheim Compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ valheim_project_dir }}/docker-compose.yml"
    owner: "{{ valheim_account.uid }}"
    group: "{{ valheim_account.group }}"
    mode: "0600"
  no_log: true

- name: Render control settings
  ansible.builtin.template:
    src: control.json.j2
    dest: "{{ valheim_state_dir }}/config.json"
    owner: "{{ valheim_account.uid }}"
    group: "{{ valheim_account.group }}"
    mode: "0600"
