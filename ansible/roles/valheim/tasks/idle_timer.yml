---
- name: Install idle-check user service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ valheim_home }}/.config/systemd/user/{{ item }}"
    owner: "{{ valheim_account.uid }}"
    group: "{{ valheim_account.group }}"
    mode: "0644"
  loop: [valheim-idle.service, valheim-idle.timer]
  register: valheim_idle_units

- name: Apply idle timer configuration
  ansible.builtin.systemd_service:
    name: valheim-idle.timer
    scope: user
    daemon_reload: true
    enabled: "{{ valheim_idle_shutdown_enabled | bool }}"
    state: "{{ 'restarted' if valheim_idle_shutdown_enabled | bool and valheim_idle_units.changed else ('started' if valheim_idle_shutdown_enabled | bool else 'stopped') }}"
  become: true
  become_user: "{{ valheim_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ valheim_runtime_dir }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path={{ valheim_runtime_dir }}/bus"
  when: not ansible_check_mode
