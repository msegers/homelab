---
- name: Disable an unselected dashboard without stopping the game
  ansible.builtin.import_tasks: dashboard_disable.yml
  when: not valheim_dashboard_enabled | bool

- name: Configure enabled private dashboard
  when: valheim_dashboard_enabled | bool
  block:
    - name: Validate dashboard port
      ansible.builtin.assert:
        that:
          - 1024 <= valheim_dashboard_port | int <= 65535
        fail_msg: Choose an unprivileged dashboard port. The listener is always 127.0.0.1.

    - name: Create dedicated dashboard group
      ansible.builtin.group:
        name: valheim-dashboard
        system: true

    - name: Create locked dashboard account without Docker or sudo groups
      ansible.builtin.user:
        name: valheim-dashboard
        group: valheim-dashboard
        groups: ""
        system: true
        shell: /usr/sbin/nologin
        home: /nonexistent
        create_home: false
        password_lock: true

    - name: Install dashboard units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [valheim-dashboard-broker.service, valheim-dashboard.service]
      register: valheim_dashboard_units

    - name: Enable private controller broker
      ansible.builtin.systemd_service:
        name: valheim-dashboard-broker.service
        daemon_reload: true
        enabled: true
        state: "{{ 'restarted' if valheim_dashboard_units.changed or valheim_rust_install.changed else 'started' }}"
      when: not ansible_check_mode

    - name: Enable loopback dashboard
      ansible.builtin.systemd_service:
        name: valheim-dashboard.service
        enabled: true
        state: "{{ 'restarted' if valheim_dashboard_units.changed or valheim_rust_install.changed else 'started' }}"
      when: not ansible_check_mode
