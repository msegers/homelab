---
- name: Disable an unselected dashboard without stopping the game
  ansible.builtin.import_tasks: dashboard_disable.yml
  when: not valheim_dashboard_enabled | bool

- name: Configure enabled private dashboard
  when: valheim_dashboard_enabled | bool
  block:
    - name: Validate dashboard port
      ansible.builtin.assert:
        that:
          - 1024 <= valheim_dashboard_port | int <= 65535
          - valheim_dashboard_bind_ip == '127.0.0.1' or valheim_dashboard_bind_ip in ansible_all_ipv4_addresses
          - valheim_dashboard_bind_ip is match('^(127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)')
          - valheim_dashboard_allowed_networks is sequence and valheim_dashboard_allowed_networks is not string
          - valheim_dashboard_allowed_networks | length > 0
          - valheim_dashboard_allowed_hosts is sequence and valheim_dashboard_allowed_hosts is not string
        fail_msg: Choose an unprivileged port, an assigned private IPv4/loopback address, and explicit allowed private networks.

    - name: Validate client network argument format
      ansible.builtin.assert:
        that: item is match('^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$')
      loop: "{{ valheim_dashboard_allowed_networks }}"

    - name: Validate allowed DNS hostname argument format
      ansible.builtin.assert:
        that:
          - item is string
          - item | length <= 253
          - item is match('^(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?$')
      loop: "{{ valheim_dashboard_allowed_hosts }}"

    - name: Discover the explicitly trusted dashboard proxy
      ansible.builtin.import_tasks: dashboard_proxy.yml

    - name: Create dedicated dashboard group
      ansible.builtin.group:
        name: valheim-dashboard
        system: true

    - name: Create locked dashboard account without Docker or sudo groups
      ansible.builtin.user:
        name: valheim-dashboard
        group: valheim-dashboard
        groups: ""
        system: true
        shell: /usr/sbin/nologin
        home: /nonexistent
        create_home: false
        password_lock: true

    - name: Install dashboard units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [valheim-dashboard-broker.service, valheim-dashboard.service]
      register: valheim_dashboard_units

    - name: Enable private controller broker
      ansible.builtin.systemd_service:
        name: valheim-dashboard-broker.service
        daemon_reload: true
        enabled: true
        state: "{{ 'restarted' if valheim_dashboard_units.changed or valheim_rust_install.changed else 'started' }}"
      when: not ansible_check_mode

    - name: Enable private dashboard
      ansible.builtin.systemd_service:
        name: valheim-dashboard.service
        enabled: true
        state: "{{ 'restarted' if valheim_dashboard_units.changed or valheim_rust_install.changed else 'started' }}"
      when: not ansible_check_mode
