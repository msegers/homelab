---
- name: Validate dedicated account settings
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Debian'
      - ansible_architecture == 'x86_64'
      - valheim_user is match('^[a-z_][a-z0-9_-]*$')
      - valheim_user not in ['root', 'docker', ansible_user | default('')]
      - valheim_home is match('^/(var/lib|home)/[A-Za-z0-9_-]+$')
    fail_msg: Use a dedicated Debian amd64 service account and its own home directory.

- name: Install rootless Docker prerequisites
  ansible.builtin.apt:
    name:
      - docker-ce-rootless-extras
      - uidmap
      - dbus-user-session
      - slirp4netns
      - fuse-overlayfs
      - acl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the dedicated Valheim group
  ansible.builtin.group:
    name: "{{ valheim_user }}"
    state: present

# A regular (non-system) user gets subordinate UID/GID ranges from useradd.
# Empty supplementary groups explicitly exclude the main Docker group.
- name: Create a locked account for the private Docker daemon
  ansible.builtin.user:
    name: "{{ valheim_user }}"
    group: "{{ valheim_user }}"
    groups: ""
    home: "{{ valheim_home }}"
    create_home: true
    shell: /usr/sbin/nologin
    password_lock: true
    state: present
  register: valheim_account

- name: Protect the service account home
  ansible.builtin.file:
    path: "{{ valheim_home }}"
    state: directory
    owner: "{{ valheim_account.uid }}"
    group: "{{ valheim_account.group }}"
    mode: "0700"

- name: Read subordinate UID and GID allocations
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: [/etc/subuid, /etc/subgid]
  register: valheim_subids

- name: Require allocated subordinate ranges
  ansible.builtin.assert:
    that:
      - ranges | length > 0
      - ranges | map('split', ':') | map('last') | map('int') | select('ge', 65536) | list | length > 0
    fail_msg: "{{ valheim_user }} needs a non-overlapping 65536-ID allocation in {{ item.item }}; use usermod --add-subuids/--add-subgids after checking existing allocations."
  vars:
    ranges: "{{ (item.content | b64decode).splitlines() | select('match', '^' ~ valheim_user ~ ':') | list }}"
  loop: "{{ valheim_subids.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Keep the private user manager available at boot
  ansible.builtin.command:
    argv: [loginctl, enable-linger, "{{ valheim_user }}"]
    creates: "/var/lib/systemd/linger/{{ valheim_user }}"

- name: Start the dedicated user manager
  ansible.builtin.systemd_service:
    name: "user@{{ valheim_account.uid }}.service"
    state: started

- name: Install and start the private Docker user service
  become: true
  become_user: "{{ valheim_user }}"
  environment:
    HOME: "{{ valheim_home }}"
    XDG_RUNTIME_DIR: "{{ valheim_runtime_dir }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path={{ valheim_runtime_dir }}/bus"
  block:
    - name: Verify the service account cannot write to the main Docker socket
      ansible.builtin.command:
        argv: [test, '!', -w, /var/run/docker.sock]
      changed_when: false
      when: not ansible_check_mode

    # --force allows coexistence with the main daemon; it does not stop/change it.
    - name: Install the official rootless Docker unit
      ansible.builtin.command:
        argv: [dockerd-rootless-setuptool.sh, install, --force]
        creates: "{{ valheim_home }}/.config/systemd/user/docker.service"
        chdir: "{{ valheim_home }}"

    - name: Enable and start only this user's Docker service
      ansible.builtin.systemd_service:
        name: docker.service
        scope: user
        enabled: true
        state: started

    - name: Inspect the private daemon security mode
      ansible.builtin.command:
        chdir: "{{ valheim_home }}"
        argv:
          - docker
          - --host
          - "unix://{{ valheim_docker_socket }}"
          - info
          - --format
          - "{{ '{{json .SecurityOptions}}' }}"
      register: valheim_daemon_security
      changed_when: false
      when: not ansible_check_mode

    - name: Refuse a rootful Docker endpoint
      ansible.builtin.assert:
        that:
          - "'name=rootless' in (valheim_daemon_security.stdout | from_json)"
        fail_msg: Valheim must use its dedicated rootless Docker daemon.
      when: not ansible_check_mode
