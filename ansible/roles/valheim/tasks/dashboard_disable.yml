---
- name: Find installed dashboard units
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop: [valheim-dashboard.service, valheim-dashboard-broker.service]
  register: valheim_dashboard_existing_units

- name: Stop and disable installed dashboard units
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    state: stopped
    enabled: false
  loop: "{{ valheim_dashboard_existing_units.results }}"
  when: item.stat.exists
  loop_control:
    label: "{{ item.item }}"
