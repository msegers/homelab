---
- name: Verify RAID before creating backup paths
  ansible.builtin.import_role:
    name: nas_storage
    tasks_from: verify_mount

- name: Validate outgoing backup configuration
  ansible.builtin.assert:
    that:
      - offsite_backup_repository is match('^rest:https://[A-Za-z0-9.:-]+/[A-Za-z0-9_./-]+$')
      - offsite_backup_password | length >= 20
      - offsite_backup_username is match('^[A-Za-z0-9_-]+$')
      - offsite_backup_http_password | length >= 12
      - offsite_backup_upload_limit | int > 0
      - offsite_backup_sources | length > 0
      - offsite_backup_calendar is match('^[A-Za-z0-9*:, /._-]+$')
      - offsite_backup_randomized_delay is match('^[0-9]+[smh]$')
      - "'\n' not in offsite_backup_password and '\r' not in offsite_backup_password"
      - "'\n' not in offsite_backup_http_password and '\r' not in offsite_backup_http_password"
  when: offsite_backup_send_enabled | bool
  no_log: true

- name: Limit source paths to the agreed RAID data and never the incoming repositories
  ansible.builtin.assert:
    that:
      - item is match('^/srv/storage/(shared|immich|backups/valheim)(/[A-Za-z0-9_.-]+)*$')
      - "'/../' not in item ~ '/' and '/./' not in item ~ '/'"
  loop: '{{ offsite_backup_sources }}'
  when: offsite_backup_send_enabled | bool

- name: Validate exclude file lines
  ansible.builtin.assert:
    that:
      - "'\n' not in item and '\r' not in item"
  loop: '{{ offsite_backup_excludes }}'
  when: offsite_backup_send_enabled | bool

- name: Validate private receiver configuration
  ansible.builtin.assert:
    that:
      - ansible_architecture == 'x86_64'
      - offsite_backup_listen_ip is match('^(127\.0\.0\.1|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3})$')
      - offsite_backup_listen_ip in ansible_all_ipv4_addresses or offsite_backup_listen_ip == '127.0.0.1'
      - offsite_backup_listen_port | int >= 1024
      - offsite_backup_listen_port | int <= 65535
      - offsite_backup_max_size | int >= 0
      - offsite_backup_server_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - offsite_backup_server_checksum is match('^sha256:[a-f0-9]{64}$')
      - offsite_backup_htpasswd | trim | length > 0
      - "'BEGIN CERTIFICATE' in offsite_backup_tls_cert"
      - "'PRIVATE KEY' in offsite_backup_tls_key"
  when: offsite_backup_receive_enabled | bool
  no_log: true

- name: Require bcrypt receiver authentication entries
  ansible.builtin.assert:
    that: item is match('^[A-Za-z0-9_-]+:\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$')
  loop: '{{ offsite_backup_htpasswd.splitlines() }}'
  when: offsite_backup_receive_enabled | bool
  no_log: true

- name: Resolve backup locations without creating directories
  ansible.builtin.command:
    argv: [/usr/bin/realpath, --canonicalize-missing, '{{ item }}']
  loop: "{{ ['/etc/homelab-offsite-backup', '/var/lib/homelab-offsite-backup'] + (offsite_backup_sources if offsite_backup_send_enabled | bool else []) + (['/srv/storage/backups/peers'] if offsite_backup_receive_enabled | bool else []) }}"
  register: offsite_backup_paths
  changed_when: false
  check_mode: false

- name: Reject symlinked or aliased backup locations
  ansible.builtin.assert:
    that: item.stdout == item.item
  loop: '{{ offsite_backup_paths.results }}'
  loop_control:
    label: '{{ item.item }}'

- name: Inspect existing backup configuration ownership
  ansible.builtin.stat:
    path: '{{ item }}'
  loop:
    - /etc/homelab-offsite-backup
    - /etc/homelab-offsite-backup/managed-by-ansible
  register: offsite_backup_config_ownership

- name: Refuse to replace an unmanaged backup configuration directory
  ansible.builtin.assert:
    that: not offsite_backup_config_ownership.results[0].stat.exists or offsite_backup_config_ownership.results[1].stat.isreg | default(false)

- name: Inspect incoming repository ownership before adopting storage
  ansible.builtin.stat:
    path: /srv/storage/backups/peers
  register: offsite_backup_existing_peers
  when: offsite_backup_receive_enabled | bool

- name: Refuse to adopt an existing unmanaged incoming repository tree
  ansible.builtin.assert:
    that:
      - not offsite_backup_existing_peers.stat.exists or receiver_unit.stat.exists or (offsite_backup_config_ownership.results[1].stat.isreg | default(false) and offsite_backup_existing_peers.stat.pw_name | default('') == 'homelab-rest-server' and offsite_backup_existing_peers.stat.mode | default('') == '0700')
  vars:
    receiver_unit: '{{ offsite_backup_units.results | selectattr("item", "equalto", "homelab-rest-server.service") | first }}'
  when: offsite_backup_receive_enabled | bool

- name: Verify existing receiver storage is not a nested foreign or read-only mount
  ansible.builtin.command:
    argv: [/usr/bin/findmnt, --noheadings, --target, /srv/storage/backups/peers, --source, 'UUID={{ nas_storage_expected_uuid }}', --types, ext4, --options, rw]
  changed_when: false
  check_mode: false
  when: offsite_backup_receive_enabled | bool and offsite_backup_existing_peers.stat.exists

- name: Verify receiver parent uses the approved filesystem before creating directories
  ansible.builtin.command:
    argv: [/usr/bin/findmnt, --noheadings, --target, /srv/storage/backups, --source, 'UUID={{ nas_storage_expected_uuid }}', --types, ext4, --options, rw]
  changed_when: false
  check_mode: false
  when: offsite_backup_receive_enabled | bool

- name: Verify each outgoing source exists
  ansible.builtin.stat:
    path: '{{ item }}'
  loop: '{{ offsite_backup_sources }}'
  when: offsite_backup_send_enabled | bool
  register: offsite_backup_source_stats

- name: Refuse an incomplete source selection
  ansible.builtin.assert:
    that: item.stat.isdir | default(false)
  loop: '{{ offsite_backup_source_stats.results }}'
  when: offsite_backup_send_enabled | bool

- name: Install distro restic client
  ansible.builtin.apt:
    name: restic
    state: present
  when: offsite_backup_send_enabled | bool

- name: Create private backup configuration directory
  ansible.builtin.file:
    path: /etc/homelab-offsite-backup
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Record backup configuration ownership
  ansible.builtin.copy:
    content: "Managed by Ansible homelab offsite backup\n"
    dest: /etc/homelab-offsite-backup/managed-by-ansible
    owner: root
    group: root
    mode: '0600'

- name: Configure outgoing backups
  ansible.builtin.import_tasks: send.yml
  when: offsite_backup_send_enabled | bool

- name: Configure incoming repositories
  ansible.builtin.import_tasks: receive.yml
  when: offsite_backup_receive_enabled | bool
