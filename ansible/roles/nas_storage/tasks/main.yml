---
- name: Manage the explicitly selected NAS mirror
  ansible.builtin.import_tasks: manage.yml
  when: nas_storage_enabled | bool
  # Non-login su may omit sbin. Also supply a known PATH to utility helpers.
  environment:
    PATH: /usr/sbin:/usr/bin:/sbin:/bin

- name: Prepare directories on the existing verified mirror
  ansible.builtin.import_tasks: directories.yml
  when: nas_storage_enabled | bool and (nas_storage_record.stat.exists or not ansible_check_mode)
