---
- name: Provision Debian homelab with Docker Compose
  hosts: homelab_hosts
  become: true
  gather_facts: true

  roles:
    - role: nas_storage
      tags: [storage]
    - common
    - docker
    - compose
    # Refresh Caddy's exact dashboard peer before optional new services can fail.
    - role: valheim
      tags: [valheim]
    - role: samba
      tags: [samba]
    - role: immich
      tags: [immich]
    - role: offsite_backup
      tags: [offsite-backup]
