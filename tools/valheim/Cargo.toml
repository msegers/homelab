[package]
name = "homelab-valheim"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "valheim-control"
path = "src/bin/control.rs"

[[bin]]
name = "valheim-dashboard"
path = "src/bin/dashboard.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fs2 = "0.4"
ipnet = "2"
libc = "0.2"
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
wait-timeout = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
